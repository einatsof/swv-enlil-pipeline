name: test

# Separate from `collect` on purpose: that workflow is an hourly data job, and a
# failing test must never stop it publishing a run (nor should every tick pay for
# a test install).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # stdlib unittest — the suite needs no test runner of its own, so this
      # installs nothing beyond what the pipeline already runs on.
      - run: python -m unittest discover -s tests -t . -v
