name: collect

on:
  schedule:
    # Hourly, offset from the top of the hour (GitHub load spikes at :00 make
    # on-the-hour crons the least reliable slot). The pipeline is idempotent — a
    # tick with no newly-promoted run costs ~3 s of network (manifest fetch +
    # two list calls) and exits.
    #
    # Polling rate does NOT drive cost: the 435 MB download happens once per
    # *operational run SWPC promotes*, ~1–2/day, and no amount of extra polling
    # creates more of them. What hourly buys is latency. SWPC promotes a run
    # ~1.3 h after it is created (58491: created 22:10, animation frames
    # published 23:36), and that lag is not ours to remove — so the polling
    # interval is the only part of the staleness we control. At 3 h the worst
    # case was ~4.3 h from run creation to the site; hourly halves it.
    #
    # It does slightly raise download count: a 3-hourly tick can step over an
    # operational run that was superseded inside the window, and hourly catches
    # both. Bounded by the promotion rate (~1 extra/day at most), and catching
    # it is the correct behaviour anyway.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: re-process even if the worker already serves the newest run
        type: boolean
        default: false

# A slow download must never overlap the next tick's run.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v5 / v6 are the first majors that target Node 24. Older tags still run,
      # but the runner forces them onto Node 24 and warns every time.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pipeline.py ${{ inputs.force && '--force' || '' }}
