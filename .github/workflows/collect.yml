name: collect

on:
  schedule:
    # Every 3 hours, offset from the top of the hour (GitHub load spikes at :00
    # make on-the-hour crons unreliable). The pipeline is idempotent — a tick
    # with no new NOAA run exits in seconds after two cheap list calls.
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: re-process even if the worker already serves the newest run
        type: boolean
        default: false

# A slow download must never overlap the next tick's run.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v5 / v6 are the first majors that target Node 24. Older tags still run,
      # but the runner forces them onto Node 24 and warns every time.
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: run pipeline
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python pipeline.py ${{ inputs.force && '--force' || '' }}
